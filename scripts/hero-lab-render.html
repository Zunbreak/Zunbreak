<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Zunbreak hero GIF render</title>
  <style>
    html, body { margin: 0; background: #020304; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="preview" width="1200" height="400"></canvas>
  <script>
    const WIDTH = 1200;
    const HEIGHT = 400;
    const canvas = document.querySelector("#preview");
    const ctx = canvas.getContext("2d", { alpha: false });
    const GITHUB_README_BG = "#0d1117";
    const PANEL = {
      x: 1,
      y: 1,
      width: WIDTH - 2,
      height: HEIGHT - 2,
      radius: 8,
      stroke: 2,
      strokeColor: "#343a43",
      fill: "#07090d",
    };
    const contentLayer = document.createElement("canvas");
    contentLayer.width = WIDTH;
    contentLayer.height = HEIGHT;
    const contentCtx = contentLayer.getContext("2d", { alpha: true });
    const daemonLayer = document.createElement("canvas");
    daemonLayer.width = WIDTH;
    daemonLayer.height = HEIGHT;
    const daemonCtx = daemonLayer.getContext("2d");
    const signalShadeLayer = document.createElement("canvas");
    signalShadeLayer.width = WIDTH;
    signalShadeLayer.height = HEIGHT;
    const signalShadeCtx = signalShadeLayer.getContext("2d");
    const sourceImage = new Image();
    const particles = makeParticles(96);
    let settings = {
      amplitude: 23,
      tempo: 0.58,
      density: 1.1,
      glow: 47,
      rings: 38,
      particles: 40,
      exposure: 107,
      titleText: "",
      subtitleText: ""
    };

    window.HERO_READY = false;
    sourceImage.onload = () => { window.HERO_READY = true; };
    sourceImage.src = "/assets/zunbreak-hero-art.png";

    function mulberry32(seed) {
      return function random() {
        let value = seed += 0x6D2B79F5;
        value = Math.imul(value ^ value >>> 15, value | 1);
        value ^= value + Math.imul(value ^ value >>> 7, value | 61);
        return ((value ^ value >>> 14) >>> 0) / 4294967296;
      };
    }

    function makeParticles(count) {
      const random = mulberry32(4401);
      return Array.from({ length: count }, () => ({
        x: 360 + random() * 815,
        y: 14 + random() * 370,
        radius: 0.45 + random() * 1.25,
        phase: random() * Math.PI * 2,
        drift: 0.4 + random() * 1.6,
        alpha: 0.16 + random() * 0.52
      }));
    }

    function appendRoundedRect(target, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      target.moveTo(x + r, y);
      target.arcTo(x + width, y, x + width, y + height, r);
      target.arcTo(x + width, y + height, x, y + height, r);
      target.arcTo(x, y + height, x, y, r);
      target.arcTo(x, y, x + width, y, r);
      target.closePath();
    }

    function fillOutsidePanel(target) {
      target.save();
      target.fillStyle = GITHUB_README_BG;
      target.beginPath();
      target.rect(0, 0, WIDTH, HEIGHT);
      appendRoundedRect(target, PANEL.x, PANEL.y, PANEL.width, PANEL.height, PANEL.radius);
      target.fill("evenodd");
      target.restore();
    }

    function renderFrameContent(target, time, config) {
      target.clearRect(0, 0, WIDTH, HEIGHT);
      target.fillStyle = PANEL.fill;
      target.fillRect(0, 0, WIDTH, HEIGHT);
      target.filter = "brightness(0.96) contrast(1.04) saturate(1.02)";
      target.drawImage(sourceImage, 0, 0, WIDTH, HEIGHT);
      target.filter = "none";
      renderDaemonExposure(target, config.exposure / 100);
      renderSignalShade(target);
      renderParticles(target, time, config);
      renderSignal(target, time, config);
      renderBrand(target, config);
    }

    function renderFrame(target, time, config) {
      renderFrameContent(contentCtx, time, config);
      target.clearRect(0, 0, WIDTH, HEIGHT);
      target.fillStyle = GITHUB_README_BG;
      target.fillRect(0, 0, WIDTH, HEIGHT);
      target.save();
      roundedRect(target, PANEL.x, PANEL.y, PANEL.width, PANEL.height, PANEL.radius);
      target.clip();
      target.drawImage(contentLayer, 0, 0);
      target.restore();
      target.save();
      target.strokeStyle = PANEL.strokeColor;
      target.lineWidth = PANEL.stroke;
      roundedRect(target, PANEL.x, PANEL.y, PANEL.width, PANEL.height, PANEL.radius);
      target.stroke();
      target.restore();
      fillOutsidePanel(target);
    }

    function renderDaemonExposure(target, exposure) {
      daemonCtx.clearRect(0, 0, WIDTH, HEIGHT);
      daemonCtx.save();
      daemonCtx.filter = `brightness(${exposure}) contrast(1.025)`;
      daemonCtx.drawImage(sourceImage, 0, 0, WIDTH, HEIGHT);
      daemonCtx.filter = "none";
      daemonCtx.globalCompositeOperation = "destination-in";
      const mask = daemonCtx.createLinearGradient(640, 0, 860, 0);
      mask.addColorStop(0, "rgba(255,255,255,0)");
      mask.addColorStop(1, "rgba(255,255,255,1)");
      daemonCtx.fillStyle = mask;
      daemonCtx.fillRect(640, 0, 560, HEIGHT);
      daemonCtx.restore();
      target.drawImage(daemonLayer, 0, 0);
    }

    const SIGNAL = { baseline: 278, centerX: 591, startX: 352, endX: 830, edgeFade: 52 };

    function signalTaper(x) {
      const edge = Math.min(x - SIGNAL.startX, SIGNAL.endX - x);
      const t = Math.max(0, Math.min(1, edge / SIGNAL.edgeFade));
      return t * t * (3 - 2 * t);
    }

    function renderSignalShade(target) {
      const { baseline, startX, endX, edgeFade } = SIGNAL;
      const width = endX - startX;
      const y0 = baseline - 70;
      const height = 140;
      const fade = edgeFade / width;
      const layer = signalShadeCtx;
      layer.clearRect(0, 0, WIDTH, HEIGHT);
      layer.globalCompositeOperation = "source-over";
      const vertical = layer.createLinearGradient(0, y0, 0, y0 + height);
      vertical.addColorStop(0, "rgba(3,5,8,0)");
      vertical.addColorStop(0.28, "rgba(3,5,8,0.55)");
      vertical.addColorStop(0.5, "rgba(3,5,8,0.8)");
      vertical.addColorStop(0.72, "rgba(3,5,8,0.55)");
      vertical.addColorStop(1, "rgba(3,5,8,0)");
      layer.fillStyle = vertical;
      layer.fillRect(startX, y0, width, height);
      layer.globalCompositeOperation = "destination-in";
      const horizontal = layer.createLinearGradient(startX, 0, endX, 0);
      horizontal.addColorStop(0, "rgba(0,0,0,0)");
      horizontal.addColorStop(fade, "rgba(0,0,0,1)");
      horizontal.addColorStop(1 - fade, "rgba(0,0,0,1)");
      horizontal.addColorStop(1, "rgba(0,0,0,0)");
      layer.fillStyle = horizontal;
      layer.fillRect(startX, y0, width, height);
      layer.globalCompositeOperation = "source-over";
      target.drawImage(signalShadeLayer, 0, 0);
    }

    function loopUnit(time, config) {
      const period = Number(config.loopPeriod) || (2 * (4.8 / Math.max(Number(config.tempo) || 0.2, 0.2)));
      const wrapped = ((time % period) + period) % period;
      const cycle = period / 2;
      return { period, cycle, u: wrapped / period, t: wrapped };
    }

    function renderParticles(target, time, config) {
      const { u, period } = loopUnit(time, config);
      const amount = Math.round(particles.length * config.particles / 100);
      const tempo = Math.max(Number(config.tempo) || 0.2, 0.2);
      target.save();
      target.globalCompositeOperation = "screen";
      for (let index = 0; index < amount; index++) {
        const particle = particles[index];
        const xTurns = Math.max(1, Math.round(period * tempo * particle.drift / (Math.PI * 2)));
        const yTurns = Math.max(1, Math.round(period * tempo * 0.7 / (Math.PI * 2)));
        const shimmerTurns = Math.max(1, Math.round(period * tempo * 2 / (Math.PI * 2)));
        const x = particle.x + Math.sin(u * xTurns * Math.PI * 2 + particle.phase) * 10;
        const y = particle.y + Math.cos(u * yTurns * Math.PI * 2 + particle.phase) * 7;
        const shimmer = .34 + .66 * (.5 + .5 * Math.sin(u * shimmerTurns * Math.PI * 2 + particle.phase));
        target.globalAlpha = particle.alpha * shimmer * .72;
        target.fillStyle = "#f1b52a";
        target.beginPath();
        target.arc(x, y, particle.radius, 0, Math.PI * 2);
        target.fill();
      }
      target.restore();
    }

    function renderSignal(target, time, config) {
      const { baseline, centerX, startX, endX } = SIGNAL;
      const step = Math.max(3, Math.round(6 / config.density));
      const amp = config.amplitude;
      const glow = config.glow / 100;
      const speed = Math.max(Number(config.tempo) || 0.2, 0.2);
      const halfSpan = Math.max(centerX - startX, endX - centerX);
      const { cycle, u, t, period } = loopUnit(time, config);

      target.save();
      target.globalCompositeOperation = "screen";
      target.lineWidth = .75;
      for (let x = startX; x < endX; x += step) {
        const taper = signalTaper(x + step / 2);
        target.strokeStyle = `rgba(236,174,31,${(.24 + glow * .16) * taper})`;
        target.beginPath();
        target.moveTo(x, baseline + .5);
        target.lineTo(Math.min(x + step, endX), baseline + .5);
        target.stroke();
      }

      if (glow > 0) {
        target.shadowColor = "rgba(244,184,43,.8)";
        target.shadowBlur = 3 + glow * 13;
      }

      const pulsePhases = Array.from({ length: 3 }, (_, index) =>
        ((t + index * cycle / 3) % cycle) / cycle
      );
      const carrierTurnsA = Math.max(1, Math.round(period * speed * 2.1 / (Math.PI * 2)));
      const carrierTurnsB = Math.max(1, Math.round(period * speed * 1.4 / (Math.PI * 2)));
      const carrierTurnsC = Math.max(1, Math.round(period * speed * 0.9 / (Math.PI * 2)));

      for (let x = startX; x <= endX; x += step) {
        const taper = signalTaper(x);
        const radialDistance = Math.abs(x - centerX);
        const radialProgress = radialDistance / halfSpan;
        let outwardPulse = 0;
        for (const pulsePhase of pulsePhases) {
          const distance = radialProgress - pulsePhase;
          const born = Math.sin(Math.PI * pulsePhase);
          const pulse = Math.exp(-(distance * distance) / .014) * born;
          outwardPulse = Math.max(outwardPulse, pulse);
        }
        const envelope = .14 + .86 * outwardPulse;
        const carrier =
          Math.sin(radialDistance * .098 * config.density - u * carrierTurnsA * Math.PI * 2) * .52 +
          Math.sin(radialDistance * .043 * config.density - u * carrierTurnsB * Math.PI * 2) * .31 +
          Math.sin(radialDistance * .173 * config.density - u * carrierTurnsC * Math.PI * 2) * .17;
        const texture = .42 + .58 * Math.abs(carrier);
        const height = (1.5 + amp * envelope * texture) * taper;
        const alpha = (.26 + envelope * (.34 + glow * .28)) * taper;
        target.strokeStyle = `rgba(244,184,43,${alpha})`;
        target.lineWidth = 1;
        target.beginPath();
        target.moveTo(x + .5, baseline - height);
        target.lineTo(x + .5, baseline + height);
        target.stroke();
      }

      target.shadowBlur = 0;
      renderRings(target, time, config);
      target.restore();
    }

    function renderRings(target, time, config) {
      const strength = config.rings / 100;
      if (strength <= 0) return;
      const centerX = 591;
      const centerY = 278;
      const { cycle, u, t } = loopUnit(time, config);
      for (let index = 0; index < 3; index++) {
        const phase = ((t + index * cycle / 3) % cycle) / cycle;
        const radius = 24 + phase * 116;
        const alpha = (1 - phase) * strength * .32;
        target.strokeStyle = `rgba(236,174,31,${alpha})`;
        target.lineWidth = 1;
        target.beginPath();
        target.arc(centerX, centerY, radius, 0, Math.PI * 2);
        target.stroke();
      }
      const corePulse = .68 + .32 * Math.sin(u * Math.PI * 4);
      const core = target.createRadialGradient(centerX, centerY, 0, centerX, centerY, 30 + strength * 18);
      core.addColorStop(0, `rgba(255,220,107,${.45 * strength * corePulse})`);
      core.addColorStop(.18, `rgba(241,178,31,${.26 * strength * corePulse})`);
      core.addColorStop(1, "rgba(241,178,31,0)");
      target.fillStyle = core;
      target.beginPath();
      target.arc(centerX, centerY, 48, 0, Math.PI * 2);
      target.fill();
    }

    function renderBrand(target, config) {
      const title = (config.titleText || "").trim().toUpperCase();
      const subtitle = (config.subtitleText || "").trim();
      target.save();
      target.textBaseline = "alphabetic";
      target.shadowColor = "rgba(0,0,0,.72)";
      if (title) {
        target.shadowBlur = 7;
        target.fillStyle = "#f4f1e9";
        target.font = '700 68px "Arial Narrow", "Roboto Condensed", "Segoe UI", sans-serif';
        drawSpacedText(target, title, 57, 226, 7.5);
      }
      if (subtitle) {
        target.shadowBlur = 4;
        target.fillStyle = "#dca51e";
        target.font = "600 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
        drawSpacedText(target, subtitle, 61, title ? 270 : 248, 3.2);
      }
      target.restore();
    }

    function drawSpacedText(target, text, x, y, spacing) {
      let cursor = x;
      for (const character of text) {
        target.fillText(character, cursor, y);
        cursor += target.measureText(character).width + spacing;
      }
    }

    function roundedRect(target, x, y, width, height, radius) {
      target.beginPath();
      appendRoundedRect(target, x, y, width, height, radius);
    }

    window.setHeroSettings = (next) => {
      settings = { ...settings, ...next };
    };

    window.renderHeroFrame = (time) => {
      renderFrame(ctx, time, settings);
      return canvas.toDataURL("image/png");
    };
  </script>
</body>
</html>

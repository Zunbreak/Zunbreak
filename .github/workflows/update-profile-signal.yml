name: Update Profile Signal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"
  push:
    paths:
      - "scripts/generate-profile-signal.mjs"
      - "scripts/github-contribution-calendar.mjs"
      - ".github/workflows/update-profile-signal.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate profile signal
        run: node scripts/generate-profile-signal.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Zunbreak

      - name: Commit changed signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-signal.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile signal"
          git push

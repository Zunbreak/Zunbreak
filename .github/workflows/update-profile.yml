name: Refresh Zunbreak Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate public activity field
        run: node scripts/generate-activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Zunbreak

      - name: Commit changed activity
        run: |
          git config user.name "zunbreak-signal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/zunbreak-activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile activity"
          git push


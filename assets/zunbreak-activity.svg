<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title description">
  <title id="title">Zunbreak activity signal</title>
  <description id="description">Public GitHub push activity, commit count and language distribution.</description>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0e13"/><stop offset="1" stop-color="#090b0f"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="268" rx="16" fill="#07090d" stroke="#303640" stroke-width="2"/>

  <g>
    <rect x="22" y="22" width="266" height="226" rx="10" fill="url(#surface)" stroke="#252b33"/>
    <text x="48" y="57" fill="#e6ad24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">ACTIVITY / 14D</text>
    <line x1="48" y1="210" x2="260" y2="210" stroke="#252b33"/>
    <rect x="62" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="74" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="86" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="98" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="110" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="122" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="134" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="146" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="158" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="170" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="182" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="194" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="206" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/><rect x="218" y="198" width="6" height="8" rx="3" fill="#f2b82b" opacity="0.18"/>
    <circle cx="50" cy="230" r="4" fill="#f2b82b"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="62" y="234" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1">QUIET</text>
  </g>

  <g>
    <rect x="310" y="22" width="266" height="226" rx="10" fill="url(#surface)" stroke="#252b33"/>
    <text x="336" y="57" fill="#e6ad24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">LAST PUBLIC PUSH</text>
    <circle cx="443" cy="127" r="45" fill="none" stroke="#5c4617"/>
    <circle cx="443" cy="127" r="28" fill="none" stroke="#9c7218"/>
    <circle cx="443" cy="127" r="7" fill="#f2b82b"><animate attributeName="r" values="6;8.5;6" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="443" cy="127" r="9" fill="#f2b82b" opacity="0.45" filter="url(#glow)"><animate attributeName="opacity" values="0.18;0.75;0.18" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="443" y="200" text-anchor="middle" fill="#f2f4f7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1">26 MAY 2026</text>
    <text x="443" y="222" text-anchor="middle" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">20:39 UTC</text>
  </g>

  <g>
    <rect x="598" y="22" width="266" height="226" rx="10" fill="url(#surface)" stroke="#252b33"/>
    <text x="624" y="57" fill="#e6ad24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">PUBLIC COMMITS / 30D</text>
    <text x="624" y="143" fill="#f4f6f8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="62" font-weight="700">00</text>
    <path d="M626 188 L646 188 655 180 666 197 677 170 688 203 699 181 710 191 721 174 732 198 743 183 754 189 774 189 786 178 798 195 810 184 834 184" fill="none" stroke="#e3a91d" stroke-width="2" opacity="0.7"/>
    <text x="624" y="225" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">PUBLIC API SIGNAL</text>
  </g>

  <g>
    <rect x="886" y="22" width="292" height="226" rx="10" fill="url(#surface)" stroke="#252b33"/>
    <text x="912" y="57" fill="#e6ad24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">LANGUAGE FIELD</text>
    <text x="916" y="112" fill="#b8bec7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">TYPESCRIPT</text>
      <rect x="1030" y="103" width="120" height="4" rx="2" fill="#252a31"/>
      <rect x="1030" y="103" width="68" height="4" rx="2" fill="#e5aa1d"/>
      <text x="1163" y="112" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">57%</text><text x="916" y="143" fill="#b8bec7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">CSS</text>
      <rect x="1030" y="134" width="120" height="4" rx="2" fill="#252a31"/>
      <rect x="1030" y="134" width="31" height="4" rx="2" fill="#e5aa1d"/>
      <text x="1163" y="143" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">26%</text><text x="916" y="174" fill="#b8bec7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">HTML</text>
      <rect x="1030" y="165" width="120" height="4" rx="2" fill="#252a31"/>
      <rect x="1030" y="165" width="13" height="4" rx="2" fill="#e5aa1d"/>
      <text x="1163" y="174" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">11%</text><text x="916" y="205" fill="#b8bec7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">JAVASCRIPT</text>
      <rect x="1030" y="196" width="120" height="4" rx="2" fill="#252a31"/>
      <rect x="1030" y="196" width="7" height="4" rx="2" fill="#e5aa1d"/>
      <text x="1163" y="205" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">6%</text>
    <text x="912" y="228" fill="#525a64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1">MEASURED ACROSS PUBLIC BUILDS</text>
  </g>
</svg>
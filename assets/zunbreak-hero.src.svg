<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Zunbreak</title>
  <description id="description">Zunbreak creative technology studio in a black and gold signal field.</description>
  <defs>
    <linearGradient id="textField" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#05070a" stop-opacity="0.6"/>
      <stop offset="0.68" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1a51a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e1a51a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e1a51a" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dy="2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="398" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <image href="zunbreak-hero-art.png" x="0" y="0" width="1200" height="400" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="820" height="400" fill="url(#textField)"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="3">
      <text x="58" y="55" fill="#e7ad25" font-size="11">&gt; SIGNAL FIELD ENGAGED</text>
      <rect x="278" y="44" width="7" height="12" fill="#e7ad25">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <text x="58" y="79" fill="#817044" font-size="9">&gt; FREQUENCY 44.1 THZ</text>
      <text x="58" y="101" fill="#817044" font-size="9">&gt; ORIGIN UNKNOWN</text>
      <text x="58" y="123" fill="#817044" font-size="9">&gt; INTENT BUILD WEIRD THINGS</text>
    </g>

    <g filter="url(#softShadow)">
      <text x="54" y="225" fill="#f4f1e9" font-family="Arial Narrow, Roboto Condensed, Segoe UI, sans-serif" font-size="70" font-weight="700" letter-spacing="11">ZUNBREAK</text>
      <text x="59" y="260" fill="#e2aa24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.4">CREATIVE TECHNOLOGY / DIGITAL PRODUCTS / STRANGE INTERNET MACHINERY</text>
    </g>

    <text x="59" y="360" fill="#77683f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="3">[ SIGNAL / 01 ]</text>

    <rect x="1" y="-90" width="1198" height="90" fill="url(#scan)">
      <animate attributeName="y" values="-90;400" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="398" rx="18" fill="none" stroke="#343a43" stroke-width="2"/>
  <path d="M2 22 Q2 2 22 2 H1166" fill="none" stroke="#e1a51a" stroke-width="2" opacity="0.75">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.4s" repeatCount="indefinite"/>
  </path>
</svg>
